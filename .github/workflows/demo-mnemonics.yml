name: Demo Mnemonics (OpenRouter)

on:
  workflow_dispatch:
    inputs:
      demo_limit:
        description: 'Số từ test'
        required: false
        default: '20'
      model:
        description: 'Model Qwen'
        required: false
        default: 'qwen/qwen3.5-flash:free'
  
  push:
    paths:
      - 'scripts/demo_mnemonics.py'
      - '.github/workflows/demo-mnemonics.yml'

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai openpyxl
      
      - name: Check Excel file
        run: |
          echo "=== Kiểm tra file Excel vocab ==="
          if [ -f "data/tu_vung_hsk.x),lsx" ]; then
            echo "✅ ' Tìm thấy data/tmu_vung_hsk.xlsx"
            lsẹ -lh data/tu_vung_hsk.xlsx
          else
            echo "❌ Không tìm thấy data/tu_vung_hsk.xlsx"
            echo ""
            echo "=== data/ folder ==="
            ls -la data/ || echo "No data folder"
            exit 1
          fi
      
      - name: Run demo mnemonics
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QWEN_MODEL: ${{ github.event.inputs.model || 'qwen/qwen3.5-flash:free' }}
          DEMO_LIMIT: ${{ github.event.inputs.demo_limit || '20' }}
          DELAY_BETWEEN: '2.0'
        run: |
          python scripts/demo_mnemonics.py
      
      - name: Show result
        run: |
          echo "=== File output ==="
          ls -la data/mnemonics_demo.json || echo "Chưa có output"
          echo ""
          echo "=== Số mẹo đã sinh ==="
          python -c "import json; d=json.load(open('data/mnemonics_demo.json')); print(len(do')" || echo "Lỗi đọc file"
      
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/mnemonics_demo.json
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ Không có thay đổi để commit"
          else
            COUNT=$(python -c "import json; print(len(json.load(open('data/mnemonics_demo.json'))))")
            git commit -m "🤖 Demo mnemonics ($COUNT từ) [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
