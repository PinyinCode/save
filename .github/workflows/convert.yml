name: Convert Excel to HTML

on:
  push:
    paths:
      # ⭐ File Excel: input.xlsx + Giao_tiếp.xlsx (đặt trong data/)
      - 'data/**'
      # File chuyên ngành
      - 'scripts/data/**'
      # Code Python
      - 'scripts/**/*.py'
      - 'scripts/config.json'
      # ⭐ FIX.PY — chạy sau convert.py để thêm tab từ data/
      - 'fix.py'
      - 'requirements.txt'
      # Workflow tự nó
      - '.github/workflows/convert.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl cn2an pypinyin jieba pandas

      - name: Verify dependencies
        run: |
          python -c "import openpyxl; print('✅ openpyxl', openpyxl.__version__)"
          python -c "import cn2an;   print('✅ cn2an', cn2an.__version__)"
          python -c "import pypinyin; print('✅ pypinyin', pypinyin.__version__)"
          python -c "import jieba;   print('✅ jieba OK')"
          python -c "import pandas;  print('✅ pandas', pandas.__version__)"

      - name: List files
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== data/ (cho fix.py) ==="
          ls -la data/ || echo "No data folder"
          echo ""
          echo "=== scripts/ ==="
          ls -la scripts/
          echo ""
          echo "=== scripts/data/ (cho convert.py) ==="
          ls -la scripts/data/ || echo "No scripts/data folder"

      - name: Pre-flight check
        run: python scripts/check.py

      # ═══════════════════════════════════════════════════════════════
      #  BƯỚC 1: Build index.html gốc (tổng hợp + chuyên ngành)
      # ═══════════════════════════════════════════════════════════════
      - name: Run convert script (build gốc)
        run: python scripts/convert.py

      - name: Verify index.html after convert
        run: |
          if [ ! -f index.html ]; then
            echo "❌ ERROR: index.html not found after convert.py"
            exit 1
          fi
          SIZE=$(stat -c%s index.html)
          echo "index.html size: $SIZE bytes"
          echo ""
          echo "Checking required elements:"
          for el in renewalModal grantTrialIfNew dropdownRenewBtn tiktokBar zaloBtn initRenewalUI RAW_DATA DATASET_REGISTRY; do
            if grep -q "$el" index.html; then
              echo "  ✅ $el"
            else
              echo "  ❌ MISSING $el"
              exit 1
            fi
          done

      # ═══════════════════════════════════════════════════════════════
      #  BƯỚC 2: Patch — thêm tab riêng cho MỌI file trong data/
      # ═══════════════════════════════════════════════════════════════
      - name: Run fix.py (thêm tab từ data/)
        run: |
          if [ -f fix.py ]; then
            python fix.py
          else
            echo "ℹ️  Không có fix.py — bỏ qua bước patch"
          fi

      # ═══════════════════════════════════════════════════════════════
      #  VERIFY SAU KHI PATCH
      # ═══════════════════════════════════════════════════════════════
      - name: Verify datasets loaded
        run: |
          echo "=== Kiểm tra bộ dữ liệu trong index.html ==="

          # Dataset gốc (convert.py tạo)
          for ds in tonghop; do
            if grep -q "\"$ds\"" index.html; then
              echo "  ✅ dataset '$ds' found"
            else
              echo "  ❌ dataset '$ds' MISSING"
              exit 1
            fi
          done

          # Dataset từ data/ (fix.py thêm) — kiểm tra động
          echo ""
          echo "=== Kiểm tra tab từ data/ ==="
          if [ -d "data" ]; then
            FOUND=0
            for f in data/*.xlsx data/*.xls data/*.csv; do
              [ -e "$f" ] || continue
              FNAME=$(basename "$f")
              # Bỏ qua file tạm
              case "$FNAME" in
                ~\$*) continue ;;
              esac
              echo "  📄 File: $FNAME"
              FOUND=$((FOUND + 1))
            done
            if [ $FOUND -eq 0 ]; then
              echo "  ℹ️  Không có file Excel nào trong data/"
            fi
          else
            echo "  ℹ️  Không có thư mục data/"
          fi

          # Kiểm tra id datasets đã inject (nếu có file giaotiep)
          if [ -f "data/Giao_tiếp.xlsx" ] || [ -f "data/giao-tiep.xlsx" ]; then
            if grep -q '"giaotiep"' index.html; then
              echo "  ✅ Tab 'Giao Tiếp' (dataset id 'giaotiep') found"
            else
              echo "  ⚠️  Tab 'Giao Tiếp' MISSING — kiểm tra log fix.py"
            fi
          fi

          # Kiểm tra CSS override auto-fit của fix.py
          if grep -q 'FIX.PY: AUTO-FIT LAYOUT' index.html; then
            echo "  ✅ CSS override từ fix.py có mặt"
          else
            echo "  ℹ️  Không có CSS override (có thể do không có file trong data/)"
          fi

      - name: Verify numbers converted
        run: |
          echo "=== Kiểm tra số Ả Rập trong index.html ==="
          if grep -q "五百" index.html; then
            echo "✅ Tìm thấy '五百'"
          else
            echo "⚠️  Không tìm thấy '五百'"
          fi
          if grep -q "四百八十" index.html; then
            echo "✅ Tìm thấy '四百八十'"
          else
            echo "⚠️  Không tìm thấy '四百八十'"
          fi

      # ═══════════════════════════════════════════════════════════════
      #  COMMIT & PUSH
      # ═══════════════════════════════════════════════════════════════
      - name: Commit & push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ Không có thay đổi để commit"
          else
            git commit -m "🤖 Auto convert Excel to HTML [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ═══════════════════════════════════════════════════════════════
      #  UPLOAD ARTIFACT (chỉ file cần thiết cho Pages)
      # ═══════════════════════════════════════════════════════════════
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          # Copy thêm assets nếu có
          [ -d "assets" ] && cp -r assets _site/ || true
          [ -d "static" ] && cp -r static _site/ || true
          # 404 cho SPA (nếu cần)
          [ -f "404.html" ] && cp 404.html _site/ || true
          echo "=== Artifact contents ==="
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: convert
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
